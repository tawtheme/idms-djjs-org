<div class="flex h-screen flex-col overflow-hidden bg-muted/40">
    <!-- Top Bar -->
    <div class="launcher-topbar flex h-12 flex-shrink-0 items-center justify-between border-b border-border bg-background px-5">
        <div class="flex items-center gap-2.5">
            <img src="assets/img/logo.png" alt="Logo" class="h-7 w-auto" />
            <span class="text-base font-bold tracking-wide text-foreground">IDMS ADMIN PANEL</span>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-sm tabular-nums text-muted-foreground">{{ currentTime }}</span>
            <button class="topbar-logout flex cursor-pointer items-center gap-1.5 rounded-md border border-border bg-muted/40 px-3.5 py-1 text-sm font-medium text-muted-foreground transition-colors hover:border-destructive/40 hover:bg-destructive/10 hover:text-destructive" (click)="logout()" type="button">
                <app-icon name="power_settings_new" />
                <span>Logout</span>
            </button>
        </div>
    </div>

    <!-- Body -->
    <div class="launcher-body flex flex-1 gap-8 overflow-y-auto p-8">
        <!-- Filter Column -->
        <div class="filter-col flex w-[200px] flex-shrink-0 flex-col gap-1.5 pt-1">
            <button class="rounded-lg px-4 py-2.5 text-left text-sm font-medium text-muted-foreground transition-colors hover:bg-muted hover:text-foreground"
                [ngClass]="{'bg-primary text-primary-foreground hover:bg-primary hover:text-primary-foreground font-semibold': activeFilter === 'All'}"
                (click)="activeFilter = 'All'">All</button>
            <button *ngFor="let group of groups"
                class="rounded-lg px-4 py-2.5 text-left text-sm font-medium text-muted-foreground transition-colors hover:bg-muted hover:text-foreground"
                [ngClass]="{'bg-primary text-primary-foreground hover:bg-primary hover:text-primary-foreground font-semibold': activeFilter === group.title}"
                (click)="activeFilter = group.title">{{ group.title }}</button>
        </div>

        <!-- Grid -->
        <div class="launcher-grid grid flex-1 grid-cols-2 content-start gap-6 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5">
            <button class="app-btn flex cursor-pointer flex-col items-center justify-center gap-3 rounded-xl border border-border bg-card px-3 pb-5 pt-7 transition-all hover:scale-[1.04] hover:border-border hover:shadow-md active:scale-[0.98]" *ngFor="let item of filteredItems"
                (click)="onCardClick(item.route)">
                <div class="flex h-[46px] w-[46px] items-center justify-center rounded-xl text-2xl" [style.background]="item.color + '18'" [style.color]="item.color">
                    <app-icon [name]="item.icon" />
                </div>
                <span class="text-center text-sm font-semibold leading-snug text-foreground">{{ item.label }}</span>
            </button>
        </div>
    </div>
</div>

<hlm-alert-dialog
    [isOpen]="showLogoutConfirm"
    title="Confirm Logout"
    message="Are you sure you want to log out?"
    confirmLabel="Logout"
    cancelLabel="Cancel"
    confirmType="danger"
    icon="logout"
    (confirm)="confirmLogout()"
    (cancel)="cancelLogout()">
</hlm-alert-dialog>
