<header class="header flex h-12 w-full flex-shrink-0 items-center justify-between border-b border-border bg-background px-4" #headerElement>
    <div class="flex items-center gap-3">
        <ng-container *ngIf="!isVmsUser">
            <button class="menu-btn flex cursor-pointer items-center gap-1.5 rounded-md border border-border bg-muted/40 px-2.5 py-1.5 text-[13px] font-medium text-foreground transition-colors hover:bg-muted" (click)="onMenuButtonClick()" type="button" title="Open navigation (F2 for quick menu)">
                <app-icon name="menu" />
                <span class="menu-label">Menu</span>
            </button>

            <div class="h-6 w-px bg-border"></div>
        </ng-container>
        <nav class="flex items-center gap-1.5 text-sm">
            <ng-container *ngFor="let crumb of breadcrumbs; let last = last; let first = first">
                <span *ngIf="!first" class="text-base text-muted-foreground/60">/</span>
                <a *ngIf="crumb.route && !last" class="cursor-pointer text-base font-medium text-muted-foreground no-underline hover:text-primary" (click)="navigateTo.emit(crumb.route)">{{ crumb.label }}</a>
                <span *ngIf="!crumb.route || last" class="text-base font-semibold text-foreground">{{ crumb.label }}</span>
            </ng-container>
        </nav>
    </div>
    <div class="flex items-center gap-2">
        <button
            *ngIf="headerActions.action() as act"
            class="inline-flex cursor-pointer items-center gap-1.5 rounded-md border border-transparent px-3 py-1.5 text-[13px] font-semibold transition-colors"
            [ngClass]="(act.type || 'primary') === 'primary' ? 'bg-primary text-primary-foreground hover:bg-primary/90' : 'bg-muted text-foreground hover:bg-muted/80'"
            (click)="act.onClick()"
            type="button">
            <app-icon *ngIf="act.icon" [name]="act.icon" />
            <span>{{ act.label }}</span>
        </button>
        <span class="max-w-[220px] overflow-hidden text-ellipsis whitespace-nowrap px-1.5 text-[13px] font-medium text-foreground" *ngIf="userEmail">{{ userEmail }}</span>
        <span class="header-user-role" *ngIf="highestRole">{{ highestRole }}</span>
        <button class="logout-btn flex cursor-pointer items-center gap-1.5 rounded-md border border-border bg-muted/40 px-3 py-1.5 text-[13px] font-medium text-muted-foreground transition-colors hover:border-destructive/40 hover:bg-destructive/10 hover:text-destructive" (click)="onLogout()" type="button" title="Logout">
            <app-icon name="logout" />
            <span class="logout-label">Logout</span>
        </button>
    </div>
</header>

<hlm-alert-dialog
    [isOpen]="showLogoutConfirm"
    title="Confirm Logout"
    message="Are you sure you want to log out?"
    confirmLabel="Logout"
    cancelLabel="Cancel"
    confirmType="danger"
    icon="logout"
    (confirm)="confirmLogout()"
    (cancel)="cancelLogout()">
</hlm-alert-dialog>

<!-- Mega Menu Modal -->
<ng-container *ngIf="!isVmsUser">
<div class="megamenu-backdrop" [class.is-open]="isMenuOpen" (click)="closeMenu()"></div>
<div class="megamenu" [class.is-open]="isMenuOpen" role="dialog" aria-modal="true">
    <div class="megamenu__body">
        <div class="megamenu__tiles">
            <button *ngFor="let tile of quickTiles"
                class="megamenu__tile"
                [class.megamenu__tile--active]="tile.route === activeRoute"
                (click)="onMenuItemClick(tile)"
                type="button">
                <app-icon [name]="tile.icon" class="megamenu__tile-icon" />
                <span class="megamenu__tile-label">{{ tile.label }}</span>
            </button>
        </div>
    </div>
</div>
</ng-container>
