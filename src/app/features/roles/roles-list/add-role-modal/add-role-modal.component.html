<hlm-dialog [isOpen]="isOpen" [title]="'Add New Role'" [size]="'small'" [closable]="true" [showHeader]="true"
    (close)="onClose()">

    <form class="flex flex-col gap-5" (ngSubmit)="onSubmit()">
        <!-- Role Name Field -->
        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="role-name">
                Role Name <span class="text-destructive">*</span>
            </label>
            <input hlmInput id="role-name" type="text" [(ngModel)]="name"
                [ngModelOptions]="{ standalone: true }" placeholder="Enter role name" required autofocus>
        </div>

        <!-- Status Dropdown -->
        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="role-status">
                Status
            </label>
            <hlm-select [options]="statusOptions" [selectedValues]="[status]" [searchable]="true"
                [closeOnSelect]="true" placeholder="Select Status" (selectionChange)="onStatusChange($event)">
            </hlm-select>
        </div>

        <!-- Form Footer -->
        <div class="mt-5 flex items-center justify-end gap-3 border-t border-border pt-5">
            <button hlmBtn variant="secondary" type="button" (click)="onClose()">
                Cancel
            </button>
            <button hlmBtn type="submit" [disabled]="!name.trim()">
                Submit
            </button>
        </div>
    </form>
</hlm-dialog>
