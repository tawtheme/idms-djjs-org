<hlm-dialog [isOpen]="isOpen" [title]="'Add Branch Area'" [size]="'small'" [closable]="true" [showHeader]="true"
    [showFooter]="true" [footerButtons]="footerButtons" [footerAlign]="'right'" (close)="onClose()"
    (footerAction)="onFooterAction($event)">

    <form class="flex flex-col gap-5" (ngSubmit)="onSubmit()">
        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="branch">Branch</label>
            <hlm-select [options]="branchOptions" [selectedValues]="branch ? [branch] : []" [searchable]="true"
                [closeOnSelect]="true" placeholder="Select Branch" (selectionChange)="onBranchChange($event)">
            </hlm-select>
        </div>

        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="area-name">Branch Area Name <span class="text-destructive">*</span></label>
            <input hlmInput id="area-name" type="text" [(ngModel)]="areaName"
                [ngModelOptions]="{ standalone: true }" placeholder="Enter branch area name" required autofocus>
        </div>

        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="status">Status</label>
            <hlm-select [options]="statusOptions" [selectedValues]="[status]" [searchable]="true"
                [closeOnSelect]="true" placeholder="Select Status" (selectionChange)="onStatusChange($event)">
            </hlm-select>
        </div>
    </form>
</hlm-dialog>
