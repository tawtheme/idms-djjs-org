<hlm-sheet [isOpen]="isOpen" [title]="'Add New Branch'" [width]="500" position="right" [closable]="true"
    [showBackdrop]="true" [closeOnBackdropClick]="false" [showFooter]="true" [footerAlign]="'right'"
    [footerButtons]="footerButtons" (close)="onClose()" (footerAction)="onFooterAction($event)">

    <form class="flex flex-col gap-6" (ngSubmit)="onSubmit()">
        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="parent-branch">Parent Branch</label>
            <hlm-select [options]="parentBranchOptions" [selectedValues]="parentBranch ? [parentBranch] : []"
                [searchable]="true" [closeOnSelect]="true" placeholder="Select Parent Branch"
                (selectionChange)="onParentBranchChange($event)">
            </hlm-select>
        </div>

        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="branch-name">Name <span class="text-destructive">*</span></label>
            <input hlmInput id="branch-name" type="text" [(ngModel)]="name"
                [ngModelOptions]="{ standalone: true }" placeholder="Enter name" required autofocus>
        </div>

        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="branch-code">Branch Code</label>
            <input hlmInput id="branch-code" type="text" [(ngModel)]="code"
                [ngModelOptions]="{ standalone: true }" placeholder="Enter branch code">
        </div>

        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="branch-head">Branch Head <span class="text-destructive">*</span></label>
            <hlm-select [options]="branchHeadOptions" [selectedValues]="branchHead ? [branchHead] : []"
                [searchable]="true" [closeOnSelect]="true" placeholder="Select Branch Head"
                (selectionChange)="onBranchHeadChange($event)">
            </hlm-select>
        </div>

        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="email">Email <span class="text-destructive">*</span></label>
            <input hlmInput id="email" type="email" [(ngModel)]="email"
                [ngModelOptions]="{ standalone: true }" placeholder="Enter email" required>
        </div>

        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="address">Address <span class="text-destructive">*</span></label>
            <input hlmInput id="address" type="text" [(ngModel)]="address"
                [ngModelOptions]="{ standalone: true }" placeholder="Enter address" required>
        </div>
        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="country">Country <span class="text-destructive">*</span></label>
            <hlm-select [options]="countryOptions" [selectedValues]="country ? [country] : []" [searchable]="true"
                [closeOnSelect]="true" placeholder="Select Country" (selectionChange)="onCountryChange($event)">
            </hlm-select>
        </div>

        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="state">State <span class="text-destructive">*</span></label>
            <input hlmInput id="state" type="text" [(ngModel)]="state"
                [ngModelOptions]="{ standalone: true }" placeholder="Enter state" required>
        </div>

        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="city">City <span class="text-destructive">*</span></label>
            <input hlmInput id="city" type="text" [(ngModel)]="city" [ngModelOptions]="{ standalone: true }"
                placeholder="Enter city" required>
        </div>

        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="pincode">Pincode <span class="text-destructive">*</span></label>
            <input hlmInput id="pincode" type="text" [(ngModel)]="pincode"
                [ngModelOptions]="{ standalone: true }" placeholder="Enter pincode" required>
        </div>

        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="can-be-parent-branch">Can be a parent branch</label>
            <hlm-select [options]="canBeParentBranchOptions" [selectedValues]="[canBeParentBranch]"
                [closeOnSelect]="true" placeholder="Select" (selectionChange)="onCanBeParentBranchChange($event)">
            </hlm-select>
        </div>

        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="status">Status</label>
            <hlm-select [options]="statusOptions" [selectedValues]="[status]" [searchable]="true"
                [closeOnSelect]="true" placeholder="Select Status" (selectionChange)="onStatusChange($event)">
            </hlm-select>
        </div>
    </form>
</hlm-sheet>
