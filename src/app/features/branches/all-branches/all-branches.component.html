<div class="flex h-full flex-col gap-4 overflow-hidden">
    <div class="flex items-center justify-between">
    </div>

    <!-- Filter Section -->
    <div class="flex flex-row justify-between gap-6">
        <hlm-select
            [options]="branchDropdownOptions"
            [selectedValues]="selectedBranchFilter"
            placeholder="Select Branch"
            [searchable]="true"
            (selectionChange)="selectedBranchFilter = $event; applyFilters()"
            [closeOnSelect]="true">
        </hlm-select>
        <input
            hlmInput
            type="search"
            placeholder="Search by Name, Code, City or Type"
            [(ngModel)]="searchTerm"
            [ngModelOptions]="{ standalone: true }"
            (input)="applyFilters()"
        />
        <button hlmBtn size="sm" type="button" (click)="openAddModal()">
            Add New
        </button>
    </div>

    <!-- Branches table + pagination -->
    <div class="flex flex-1 flex-col overflow-hidden min-h-0">
    <div class="overflow-y-auto max-h-full rounded-lg border border-border">
        <table class="w-full border-collapse text-sm">
            <thead class="bg-muted border-b border-border">
                <tr>
                    <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-right text-xs font-semibold text-muted-foreground whitespace-nowrap">Action</th>
                    <th (click)="sortBy('name')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                        Name
                        <app-icon [name]="getSortIcon('name')" class="sort-icon" [size]="14" />
                    </th>
                    <th (click)="sortBy('code')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                        Code
                        <app-icon [name]="getSortIcon('code')" class="sort-icon" [size]="14" />
                    </th>
                    <th (click)="sortBy('city')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                        City
                        <app-icon [name]="getSortIcon('city')" class="sort-icon" [size]="14" />
                    </th>
                    <th (click)="sortBy('type')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                        Type
                        <app-icon [name]="getSortIcon('type')" class="sort-icon" [size]="14" />
                    </th>
                    <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground whitespace-nowrap">Status</th>
                    <th (click)="sortBy('createdAt')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                        Created At
                        <app-icon [name]="getSortIcon('createdAt')" class="sort-icon" [size]="14" />
                    </th>
                </tr>
            </thead>
            <tbody>
                <ng-container *ngIf="!isLoading">
                    <tr *ngFor="let branch of pagedBranches; trackBy: trackById" class="border-t border-border bg-card transition-colors hover:bg-muted/50 first:border-t-0 relative" (click)="$event.stopPropagation()">
                        <td data-label="Action" class="px-3 py-3 text-sm font-medium text-foreground align-top text-right" (click)="$event.stopPropagation()">
                            <hlm-menu
                                [options]="getActionOptions(branch)"
                                (selectionChange)="onAction(branch, $event)">
                            </hlm-menu>
                        </td>
                        <td data-label="Name" class="name px-3 py-3 text-sm font-medium text-foreground align-top">
                            {{ branch.name }}
                        </td>
                        <td data-label="Code" class="px-3 py-3 text-sm font-medium text-foreground align-top">
                            {{ branch.code }}
                        </td>
                        <td data-label="City" class="px-3 py-3 text-sm font-medium text-foreground align-top">
                            {{ branch.city }}
                        </td>
                        <td data-label="Type" class="px-3 py-3 text-sm font-medium text-foreground align-top">
                            {{ branch.type }}
                        </td>
                        <td data-label="Status" class="status px-3 py-3 text-sm font-medium text-foreground align-top">
                            <span class="status-badge" [ngClass]="'status-' + (branch.status | lowercase)">
                                {{ branch.status }}
                            </span>
                        </td>
                        <td data-label="Created At" class="date px-3 py-3 text-sm font-medium text-foreground align-top">
                            {{ branch.createdAt }}
                        </td>
                    </tr>
                    <!-- Empty state -->
                    <tr *ngIf="pagedBranches.length === 0" class="border-t border-border bg-card first:border-t-0 relative">
                        <td [attr.colspan]="8" class="px-5 py-10 text-center">
                            <hlm-empty-state
                                [title]="searchTerm ? 'No Results Found' : 'No Branches Found'"
                                [description]="searchTerm ? 'No branches match your search criteria.' : 'There are no branches available at the moment.'"
                                [size]="'small'">
                            </hlm-empty-state>
                        </td>
                    </tr>
                </ng-container>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <hlm-pagination
        [total]="totalItems"
        [pageSize]="pageSize"
        [currentPage]="currentPage"
        [pageSizeOptions]="pageSizeOptions"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)">
    </hlm-pagination>
    </div>

    <!-- Add New Branch Sidepanel -->
    <app-add-branch-modal
        *ngIf="isAddModalOpen"
        [isOpen]="isAddModalOpen"
        (close)="closeAddModal()"
        (submit)="onAddBranchSubmit($event)">
    </app-add-branch-modal>
</div>
