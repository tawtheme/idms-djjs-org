<div class="mx-auto max-w-7xl px-4 py-6">
    <div class="mb-6">
        <h2 class="m-0 mb-1 text-2xl font-bold text-foreground">Add New Branch</h2>
        <p class="m-0 text-sm text-muted-foreground">Fill in the details below to create a new branch</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
        <!-- Branch Information -->
        <section class="rounded-xl border border-border bg-card p-6">
            <header class="mb-5 border-b border-border/60 pb-3">
                <h3 class="m-0 text-base font-semibold text-foreground">Branch Information</h3>
            </header>
            <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="branch-name">Name <span class="text-destructive">*</span></label>
                    <input hlmInput id="branch-name" type="text" [(ngModel)]="name" [ngModelOptions]="{ standalone: true }" placeholder="Enter name" required>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="branch-code">Branch Code</label>
                    <input hlmInput id="branch-code" type="text" [(ngModel)]="code" [ngModelOptions]="{ standalone: true }" placeholder="Enter branch code">
                </div>
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="parent-branch">Parent Branch</label>
                    <hlm-select [options]="parentBranchOptions" [selectedValues]="parentBranch ? [parentBranch] : []" [searchable]="true" [closeOnSelect]="true" placeholder="Select Parent Branch" (selectionChange)="onParentBranchChange($event)"></hlm-select>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="branch-head">Branch Head <span class="text-destructive">*</span></label>
                    <hlm-select [options]="branchHeadOptions" [selectedValues]="branchHead ? [branchHead] : []" [searchable]="true" [closeOnSelect]="true" placeholder="Select Branch Head" (selectionChange)="onBranchHeadChange($event)"></hlm-select>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="can-be-parent-branch">Can be a Parent Branch</label>
                    <hlm-select [options]="canBeParentBranchOptions" [selectedValues]="[canBeParentBranch]" [closeOnSelect]="true" placeholder="Select" (selectionChange)="onCanBeParentBranchChange($event)"></hlm-select>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="status">Status</label>
                    <hlm-select [options]="statusOptions" [selectedValues]="[status]" [closeOnSelect]="true" placeholder="Select Status" (selectionChange)="onStatusChange($event)"></hlm-select>
                </div>
            </div>
        </section>

        <!-- Contact Details -->
        <section class="rounded-xl border border-border bg-card p-6">
            <header class="mb-5 border-b border-border/60 pb-3">
                <h3 class="m-0 text-base font-semibold text-foreground">Contact Details</h3>
            </header>
            <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="email">Email <span class="text-destructive">*</span></label>
                    <input hlmInput id="email" type="email" [(ngModel)]="email" [ngModelOptions]="{ standalone: true }" placeholder="Enter email" required>
                </div>
            </div>
        </section>

        <!-- Address -->
        <section class="rounded-xl border border-border bg-card p-6">
            <header class="mb-5 border-b border-border/60 pb-3">
                <h3 class="m-0 text-base font-semibold text-foreground">Address</h3>
            </header>
            <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
                <div class="flex flex-col gap-1.5 md:col-span-2">
                    <label hlmLabel for="address">Address <span class="text-destructive">*</span></label>
                    <input hlmInput id="address" type="text" [(ngModel)]="address" [ngModelOptions]="{ standalone: true }" placeholder="Enter address" required>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="country">Country <span class="text-destructive">*</span></label>
                    <hlm-select [options]="countryOptions" [selectedValues]="country ? [country] : []" [searchable]="true" [closeOnSelect]="true" placeholder="Select Country" (selectionChange)="onCountryChange($event)"></hlm-select>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="state">State <span class="text-destructive">*</span></label>
                    <input hlmInput id="state" type="text" [(ngModel)]="state" [ngModelOptions]="{ standalone: true }" placeholder="Enter state" required>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="city">City <span class="text-destructive">*</span></label>
                    <input hlmInput id="city" type="text" [(ngModel)]="city" [ngModelOptions]="{ standalone: true }" placeholder="Enter city" required>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="pincode">Pincode <span class="text-destructive">*</span></label>
                    <input hlmInput id="pincode" type="text" [(ngModel)]="pincode" [ngModelOptions]="{ standalone: true }" placeholder="Enter pincode" required>
                </div>
            </div>
        </section>

        <!-- Form Actions -->
        <div class="flex items-center justify-end gap-3 pt-2">
            <button hlmBtn variant="secondary" type="button" (click)="onReset()" [disabled]="isLoading">Reset</button>
            <button hlmBtn type="submit" [disabled]="isLoading">
                {{ isLoading ? 'Submitting...' : 'Create Branch' }}
            </button>
        </div>
    </form>
</div>
