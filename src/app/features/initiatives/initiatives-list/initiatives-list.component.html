<div class="flex h-full flex-col gap-4 overflow-hidden">
    <div class="flex items-center justify-between">
    </div>

    <!-- Filter Section -->
    <div class="flex flex-row justify-between gap-6">
        <input
            hlmInput
            type="search"
            placeholder="Search by Name"
            [(ngModel)]="searchTerm"
            [ngModelOptions]="{ standalone: true }"
            (input)="applyFilters()"
        />
        <div class="flex flex-1 justify-between gap-3">
            <hlm-select
                [options]="branchSearchTypeOptions"
                [selectedValues]="branchSearchType ? [branchSearchType] : []"
                [closeOnSelect]="true"
                placeholder="Branch Search Type"
                (selectionChange)="onBranchSearchTypeChange($event)">
            </hlm-select>
            <hlm-select
                [options]="correspondingBranchOptions"
                [selectedValues]="correspondingBranch ? [correspondingBranch] : []"
                [closeOnSelect]="true"
                placeholder="Corresponding Branch"
                (selectionChange)="onCorrespondingBranchChange($event)">
            </hlm-select>
            <hlm-select
                [options]="taskBranchOptions"
                [selectedValues]="taskBranch ? [taskBranch] : []"
                [closeOnSelect]="true"
                placeholder="Task Branch"
                (selectionChange)="onTaskBranchChange($event)">
            </hlm-select>
            <button hlmBtn size="sm" type="button" (click)="openAddModal()">
                Add New
            </button>
        </div>
    </div>

    <!-- Initiatives table + pagination -->
    <div class="flex flex-1 flex-col overflow-hidden min-h-0">
    <div class="overflow-y-auto max-h-full rounded-lg border border-border">
        <table class="w-full border-collapse text-sm">
            <thead class="bg-muted border-b border-border">
                <tr>
                    <th class="checkbox-column sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                        <input
                            type="checkbox"
                            [checked]="isAllSelected()"
                            [indeterminate]="isIndeterminate()"
                            (change)="toggleSelectAll($event)"
                            (click)="$event.stopPropagation()"
                        />
                    </th>
                    <th (click)="sortBy('name')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                        Name
                        <app-icon [name]="getSortIcon('name')" class="sort-icon" [size]="14" />
                    </th>
                    <th (click)="sortBy('createdAt')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                        Created At
                        <app-icon [name]="getSortIcon('createdAt')" class="sort-icon" [size]="14" />
                    </th>
                    <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-xs font-semibold text-muted-foreground text-right whitespace-nowrap">Action</th>
                </tr>
            </thead>
            <tbody>
                <ng-container *ngIf="!isLoading">
                    <tr *ngFor="let initiative of pagedInitiatives; trackBy: trackById" (click)="$event.stopPropagation()" class="border-t border-border bg-card transition-colors hover:bg-muted/50 first:border-t-0 relative">
                        <td class="checkbox-column px-3 py-3 text-sm font-medium text-foreground align-top" (click)="$event.stopPropagation()">
                            <input
                                type="checkbox"
                                [checked]="selectedInitiatives.has(initiative.id)"
                                (change)="toggleSelectInitiative(initiative.id, $event)">
                        </td>
                        <td data-label="Name" class="px-3 py-3 text-sm font-medium text-foreground align-top">
                            {{ initiative.name }}
                        </td>
                        <td data-label="Created At" class="px-3 py-3 text-sm font-medium text-foreground align-top">
                            {{ initiative.createdAt }}
                        </td>
                        <td data-label="Action" class="px-3 py-3 text-sm font-medium text-foreground align-top text-right" (click)="$event.stopPropagation()">
                            <hlm-menu
                                [options]="getActionOptions(initiative)"
                                (selectionChange)="onAction(initiative, $event)">
                            </hlm-menu>
                        </td>
                    </tr>
                    <!-- Empty state -->
                    <tr *ngIf="pagedInitiatives.length === 0" class="border-t border-border bg-card transition-colors hover:bg-muted/50 first:border-t-0 relative">
                        <td [attr.colspan]="4" class="px-5 py-10 text-center">
                            <hlm-empty-state
                                [title]="searchTerm ? 'No Results Found' : 'No Initiatives Found'"
                                [description]="searchTerm ? 'No initiatives match your search criteria.' : 'There are no initiatives available at the moment.'"
                                [size]="'small'">
                            </hlm-empty-state>
                        </td>
                    </tr>
                </ng-container>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <hlm-pagination
        [total]="totalItems"
        [pageSize]="pageSize"
        [currentPage]="currentPage"
        [pageSizeOptions]="pageSizeOptions"
        (pageChange)="onPageChange($event)"
        (pageSizeChange)="onPageSizeChange($event)">
    </hlm-pagination>
    </div>

    <!-- Add New Initiative Modal - Only render when needed -->
    <app-add-initiative-modal
        *ngIf="isAddModalOpen"
        [isOpen]="isAddModalOpen"
        (close)="closeAddModal()"
        (submit)="onAddInitiativeSubmit($event)">
    </app-add-initiative-modal>
</div>
