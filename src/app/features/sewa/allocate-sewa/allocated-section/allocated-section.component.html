<div class="section allocated-section">
    <div class="section-header">
        <div class="section-title">Allocated</div>
    </div>

    <div class="section-controls">
        <div class="search-control">
            <input hlmInput type="text" [(ngModel)]="searchTerm" placeholder="Search..."
                (keyup.enter)="onSearchEnter()">
        </div>
        <button hlmBtn variant="secondary" size="sm" type="button" (click)="onUnassign()"
            [disabled]="selectedIds.size === 0">
            Unassign
        </button>
    </div>

    <!-- Empty State -->
    <div *ngIf="filteredVolunteers.length === 0" class="allocated-state">
        <div class="no-data">No Allocated Volunteers Found</div>
    </div>

    <!-- Table (only shown when there's data) -->
    <div *ngIf="filteredVolunteers.length > 0" class="overflow-y-auto max-h-full rounded-lg border border-border">
        <table class="w-full border-collapse text-sm">
            <thead class="bg-muted border-b border-border">
                <tr>
                    <th class="checkbox-column sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                        <input
                            type="checkbox"
                            [checked]="isAllSelected()"
                            [indeterminate]="isIndeterminate()"
                            (change)="toggleSelectAll($event)"
                            (click)="$event.stopPropagation()">
                    </th>
                    <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground whitespace-nowrap">Head</th>
                    <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground whitespace-nowrap">Sub Head</th>
                    <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground whitespace-nowrap">Is Regular</th>
                    <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground whitespace-nowrap">Id</th>
                    <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground whitespace-nowrap">Badge No</th>
                    <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground whitespace-nowrap">Name</th>
                    <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground whitespace-nowrap">Image</th>
                    <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground whitespace-nowrap">Sewa</th>
                </tr>
            </thead>
            <tbody>
                <tr *ngFor="let volunteer of filteredVolunteers; trackBy: trackById" class="border-t border-border bg-card transition-colors hover:bg-muted/50 first:border-t-0 relative" (click)="$event.stopPropagation()">
                    <td class="checkbox-column px-3 py-3 text-sm font-medium text-foreground align-top" (click)="$event.stopPropagation()">
                        <input
                            type="checkbox"
                            [checked]="selectedIds.has(volunteer.id)"
                            (change)="toggleSelect(volunteer.id, $event)">
                    </td>
                    <td data-label="Head" class="px-3 py-3 text-sm font-medium text-foreground align-top" (click)="$event.stopPropagation()">
                        <input type="checkbox"
                            [checked]="volunteer.headChecked"
                            [disabled]="volunteer.subHeadChecked"
                            (change)="toggleHead(volunteer, $event)" />
                    </td>
                    <td data-label="Sub Head" class="px-3 py-3 text-sm font-medium text-foreground align-top" (click)="$event.stopPropagation()">
                        <input type="checkbox"
                            [checked]="volunteer.subHeadChecked"
                            [disabled]="volunteer.headChecked"
                            (change)="toggleSubHead(volunteer, $event)" />
                    </td>
                    <td data-label="Is Regular" class="px-3 py-3 text-sm font-medium text-foreground align-top" (click)="$event.stopPropagation()">
                        <input type="checkbox"
                            [checked]="volunteer.isRegular"
                            (change)="toggleIsRegular(volunteer, $event)" />
                    </td>
                    <td data-label="Id" class="px-3 py-3 text-sm font-medium text-foreground align-top">{{ volunteer.uniqueId || volunteer.id }}</td>
                    <td data-label="Badge No" class="px-3 py-3 text-sm font-medium text-foreground align-top">{{ volunteer.badgeNo || '-' }}</td>
                    <td data-label="Name" class="name px-3 py-3 text-sm font-medium text-foreground align-top">{{ volunteer.name }}</td>
                    <td data-label="Image" class="image-column px-3 py-3 text-sm font-medium text-foreground align-top">
                        <div class="volunteer-image">
                            <img [src]="volunteer.image || '/assets/img/placeholder.svg'"
                                 [alt]="volunteer.name"
                                 [appImagePreview]="volunteer.image"
                                 [previewTitle]="volunteer.name || 'Volunteer Photo'"
                                 onerror="this.src='/assets/img/placeholder.svg'">
                        </div>
                    </td>
                    <td data-label="Sewa" class="px-3 py-3 text-sm font-medium text-foreground align-top">{{ volunteer.sewa || '-' }}</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Load More -->
    <div *ngIf="hasMore && filteredVolunteers.length > 0 && !isLoading" class="load-more">
        <button class="load-more__btn" type="button" (click)="loadMore()" [disabled]="isLoadingMore">
            <span class="load-more__count">Showing {{ volunteers.length }} of {{ totalItems }}</span>
            <span class="load-more__sep">-</span>
            {{ isLoadingMore ? 'Loading...' : 'Load More' }}
        </button>
    </div>
</div>
