<div class="flex h-full flex-col gap-4 overflow-hidden">
    <!-- Error state -->
    <div *ngIf="error && !isLoading" class="error-state">
        <p>{{ error }}</p>
        <button hlmBtn size="sm" (click)="loadSewas()">Retry</button>
    </div>

    <!-- Filter Section -->
    <div class="flex flex-row justify-between gap-6" *ngIf="!error">
        <div class="flex flex-1 justify-between gap-3">
            <input hlmInput type="search" placeholder="Search by Name or Type" [(ngModel)]="searchTerm"
                [ngModelOptions]="{ standalone: true }" (input)="onSearchChange()" />
        </div>
        <div class="flex flex-1 justify-between gap-3">
            <hlm-select [options]="typeOptions" [selectedValues]="selectedType" placeholder="Type"
                (selectionChange)="selectedType = $event; onSearchChange()" [closeOnSelect]="true">
            </hlm-select>
            <button hlmBtn variant="secondary" size="sm" type="button" (click)="resetFilter()">
                <app-icon name="refresh" />
                Reset
            </button>
            <button hlmBtn size="sm" type="button" (click)="openAddModal()">Add New</button>
        </div>
    </div>

    <!-- Sewa table -->
    <div class="flex flex-1 flex-col overflow-hidden min-h-0">
        <div class="overflow-y-auto max-h-full rounded-lg border border-border">
            <table class="w-full border-collapse text-sm">
                <thead class="bg-muted border-b border-border">
                    <tr>
                        <th class="checkbox-column sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                            <input type="checkbox" [checked]="isAllSelected()" [indeterminate]="isIndeterminate()"
                                (change)="toggleSelectAll($event)" (click)="$event.stopPropagation()">
                        </th>
                        <th (click)="sortBy('name')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                            Name
                            <app-icon [name]="getSortIcon('name')" class="sort-icon" [size]="14" />
                        </th>
                        <th (click)="sortBy('type')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                            Type
                            <app-icon [name]="getSortIcon('type')" class="sort-icon" [size]="14" />
                        </th>
                        <th (click)="sortBy('createdAt')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                            Created At
                            <app-icon [name]="getSortIcon('createdAt')" class="sort-icon" [size]="14" />
                        </th>
                        <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-right text-xs font-semibold text-muted-foreground whitespace-nowrap">Action</th>
                    </tr>
                </thead>
                <tbody>
                    <ng-container *ngIf="!isLoading">
                        <tr *ngFor="let sewa of sewas; trackBy: trackById" class="border-t border-border bg-card transition-colors hover:bg-muted/50 first:border-t-0 relative" (click)="$event.stopPropagation()">
                            <td class="checkbox-column px-3 py-3 text-sm font-medium text-foreground align-top" (click)="$event.stopPropagation()">
                                <input type="checkbox" [checked]="selectedSewas.has(sewa.id)"
                                    (change)="toggleSelectSewa(sewa.id, $event)">
                            </td>
                            <td data-label="Name" class="name px-3 py-3 text-sm font-medium text-foreground align-top">
                                {{ sewa.name }}
                            </td>
                            <td data-label="Type" class="px-3 py-3 text-sm font-medium text-foreground align-top">
                                {{ sewa.type }}
                            </td>
                            <td data-label="Created At" class="date px-3 py-3 text-sm font-medium text-foreground align-top">
                                {{ sewa.createdAt | date:'dd/MM/yyyy h:mm a' }}
                            </td>
                            <td data-label="Action" class="px-3 py-3 text-sm font-medium text-foreground align-top text-right" (click)="$event.stopPropagation()">
                                <hlm-menu [options]="getActionOptions(sewa)"
                                    (selectionChange)="onAction(sewa, $event)">
                                </hlm-menu>
                            </td>
                        </tr>
                        <!-- Empty state -->
                        <tr *ngIf="sewas.length === 0" class="border-t border-border bg-card first:border-t-0 relative">
                            <td [attr.colspan]="5" class="px-5 py-10 text-center">
                                <hlm-empty-state
                                    [title]="searchTerm || selectedType.length > 0 ? 'No Results Found' : 'No Sewa Found'"
                                    [description]="searchTerm || selectedType.length > 0 ? 'No sewa match your search criteria.' : 'There are no sewa to display at the moment.'"
                                    [size]="'small'">
                                </hlm-empty-state>
                            </td>
                        </tr>
                    </ng-container>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <hlm-pagination [total]="totalItems" [pageSize]="pageSize" [currentPage]="currentPage"
            [pageSizeOptions]="pageSizeOptions" (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">
        </hlm-pagination>
    </div>

    <!-- Add/Edit Sewa Modal -->
    <app-add-sewa-modal *ngIf="isAddModalOpen" [isOpen]="isAddModalOpen"
        [title]="isEditMode ? 'Edit Sewa' : 'Add New Sewa'" [initialData]="editingSewa" (close)="closeAddModal()"
        (submit)="onAddSewaSubmit($event)">
    </app-add-sewa-modal>

    <!-- Delete Confirmation Dialog -->
    <hlm-alert-dialog [isOpen]="isDeleteDialogOpen" [title]="'Delete Sewa'"
        [message]="'Are you sure you want to delete \'' + (sewaToDelete?.name || 'this sewa') + '\'? This action cannot be undone.'"
        [confirmLabel]="'Delete'" [confirmType]="'danger'" (confirm)="confirmDelete()" (cancel)="cancelDelete()">
    </hlm-alert-dialog>
</div>
