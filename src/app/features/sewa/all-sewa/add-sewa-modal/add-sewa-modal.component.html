<hlm-dialog [isOpen]="isOpen" [title]="title" [size]="'small'" [closable]="true" [showHeader]="true" [showFooter]="true"
    [footerButtons]="footerButtons" [footerAlign]="'right'" (close)="onClose()" (footerAction)="onFooterAction($event)">

    <form class="flex flex-col gap-5" (ngSubmit)="onSubmit()">
        <!-- Sewa Name Field -->
        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="sewa-name">
                Sewa Name <span class="text-destructive">*</span>
            </label>
            <input hlmInput id="sewa-name" type="text" [(ngModel)]="name"
                [ngModelOptions]="{ standalone: true }" placeholder="Enter sewa name" required autofocus>
        </div>

        <!-- Type Dropdown -->
        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="sewa-type">
                Type <span class="text-destructive">*</span>
            </label>
            <hlm-select [options]="typeOptions" [selectedValues]="type ? [type] : []" [closeOnSelect]="true"
                placeholder="Select Type" (selectionChange)="onTypeChange($event)">
            </hlm-select>
        </div>
    </form>
</hlm-dialog>
