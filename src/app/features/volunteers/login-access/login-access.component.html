<div class="mx-auto max-w-[900px] px-6 py-6">
    <div class="mb-4 inline-flex gap-1 rounded-xl border border-border bg-muted p-1" role="tablist">
        <button
            type="button"
            role="tab"
            class="rounded-lg border-0 bg-transparent px-[18px] py-2 text-sm font-medium leading-none text-muted-foreground transition-colors hover:bg-card hover:text-foreground"
            [class.bg-card]="activeTab === 'provide'"
            [class.text-primary]="activeTab === 'provide'"
            [class.shadow-sm]="activeTab === 'provide'"
            [attr.aria-selected]="activeTab === 'provide'"
            (click)="activeTab = 'provide'">
            Login Access
        </button>
        <button
            type="button"
            role="tab"
            class="rounded-lg border-0 bg-transparent px-[18px] py-2 text-sm font-medium leading-none text-muted-foreground transition-colors hover:bg-card hover:text-foreground"
            [class.bg-card]="activeTab === 'deactivate'"
            [class.text-primary]="activeTab === 'deactivate'"
            [class.shadow-sm]="activeTab === 'deactivate'"
            [attr.aria-selected]="activeTab === 'deactivate'"
            (click)="activeTab = 'deactivate'">
            Deactivate Access
        </button>
    </div>

    <!-- Provide Login Access -->
    <form *ngIf="activeTab === 'provide'" (ngSubmit)="onSubmit()" class="flex flex-col gap-5 rounded-xl border border-border bg-card p-6">
        <div class="border-b border-border/60 pb-3">
            <h3 class="m-0 text-base font-semibold text-foreground">Login Access Information</h3>
        </div>
        <div class="grid grid-cols-1 gap-4">
            <div class="flex flex-col gap-1.5">
                <label hlmLabel for="login-password">Password <span class="text-destructive">*</span></label>
                <div class="relative">
                    <input
                        hlmInput
                        id="login-password"
                        [type]="showPassword ? 'text' : 'password'"
                        class="pr-10"
                        [(ngModel)]="password"
                        [ngModelOptions]="{ standalone: true }"
                        placeholder="Enter password"
                        required>
                    <button
                        type="button"
                        class="absolute right-2 top-1/2 inline-flex h-7 w-7 -translate-y-1/2 items-center justify-center rounded text-muted-foreground hover:bg-muted hover:text-foreground"
                        (click)="showPassword = !showPassword"
                        [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
                        <app-icon [name]="showPassword ? 'visibility_off' : 'visibility'" [size]="18" />
                    </button>
                </div>
            </div>
            <div class="flex flex-col gap-1.5">
                <label hlmLabel>Select Login Users</label>
                <hlm-select
                    [options]="assignLoginUsersOptions"
                    [selectedValues]="selectedLoginUsers"
                    [placeholder]="isLoadingLoginUsers ? 'Loading login users…' : 'Type to search login users…'"
                    [autocomplete]="true"
                    [searchable]="true"
                    [multiSelect]="true"
                    [showSelectAll]="true"
                    [showSelectedItems]="false"
                    [loading]="isLoadingLoginUsers"
                    (selectionChange)="selectedLoginUsers = $event"
                    [closeOnSelect]="false">
                </hlm-select>
                <div class="mt-2" *ngIf="getSelectedLoginUsersOptions().length">
                    <div class="flex flex-wrap gap-1.5">
                        <span class="inline-flex items-center gap-1.5 rounded-full bg-primary/10 px-2.5 py-1 text-xs text-primary" *ngFor="let opt of getSelectedLoginUsersOptions()">
                            {{ opt.label }}
                            <button type="button" class="inline-flex h-4 w-4 items-center justify-center rounded-full border-0 bg-transparent text-inherit hover:bg-black/10" (click)="removeLoginUsers(opt.value)" [attr.aria-label]="'Remove ' + opt.label">
                                <app-icon name="close" [size]="12" />
                            </button>
                        </span>
                    </div>
                    <div class="mt-2 flex items-center justify-between text-xs text-muted-foreground">
                        <span>{{ selectedLoginUsers.length }} selected</span>
                        <button type="button" class="border-0 bg-transparent text-xs text-primary hover:underline" (click)="selectedLoginUsers = []">Clear all</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex items-center justify-end gap-3 pt-2">
            <button hlmBtn variant="secondary" type="button" (click)="onReset()" [disabled]="isLoading">Reset</button>
            <button hlmBtn type="submit" [disabled]="isLoading">
                {{ isLoading ? 'Submitting...' : 'Provide Login Access' }}
            </button>
        </div>
    </form>

    <!-- Deactivate Login Access -->
    <form *ngIf="activeTab === 'deactivate'" (ngSubmit)="onDeactivate()" class="flex flex-col gap-5 rounded-xl border border-border bg-card p-6">
        <div class="border-b border-border/60 pb-3">
            <h3 class="m-0 text-base font-semibold text-foreground">Deactivate Login Access</h3>
            <p class="mt-1 text-sm text-muted-foreground">Select users whose login access should be revoked.</p>
        </div>
        <div class="grid grid-cols-1 gap-4">
            <div class="flex flex-col gap-1.5">
                <label hlmLabel>Select Users to Deactivate</label>
                <hlm-select
                    [options]="deactivateUsersOptions"
                    [selectedValues]="selectedDeactivateUsers"
                    [placeholder]="isLoadingDeactivateUsers ? 'Loading users…' : 'Type to search users…'"
                    [autocomplete]="true"
                    [searchable]="true"
                    [multiSelect]="true"
                    [showSelectAll]="true"
                    [showSelectedItems]="false"
                    [loading]="isLoadingDeactivateUsers"
                    (selectionChange)="selectedDeactivateUsers = $event"
                    [closeOnSelect]="false">
                </hlm-select>
                <div class="mt-2" *ngIf="getSelectedDeactivateUsersOptions().length">
                    <div class="flex flex-wrap gap-1.5">
                        <span class="inline-flex items-center gap-1.5 rounded-full bg-primary/10 px-2.5 py-1 text-xs text-primary" *ngFor="let opt of getSelectedDeactivateUsersOptions()">
                            {{ opt.label }}
                            <button type="button" class="inline-flex h-4 w-4 items-center justify-center rounded-full border-0 bg-transparent text-inherit hover:bg-black/10" (click)="removeDeactivateUsers(opt.value)" [attr.aria-label]="'Remove ' + opt.label">
                                <app-icon name="close" [size]="12" />
                            </button>
                        </span>
                    </div>
                    <div class="mt-2 flex items-center justify-between text-xs text-muted-foreground">
                        <span>{{ selectedDeactivateUsers.length }} selected</span>
                        <button type="button" class="border-0 bg-transparent text-xs text-primary hover:underline" (click)="selectedDeactivateUsers = []">Clear all</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="flex items-center justify-end gap-3 pt-2">
            <button hlmBtn variant="secondary" type="button" (click)="onDeactivateReset()" [disabled]="isDeactivating">Reset</button>
            <button hlmBtn variant="destructive" type="submit" [disabled]="isDeactivating">
                {{ isDeactivating ? 'Deactivating...' : 'Deactivate Login Access' }}
            </button>
        </div>
    </form>
</div>
