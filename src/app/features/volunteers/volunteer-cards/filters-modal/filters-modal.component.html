<hlm-dialog
    [isOpen]="isOpen"
    title="More Filters"
    size="medium"
    [closable]="true"
    [showHeader]="true"
    [showFooter]="true"
    (close)="onClose()">

    <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
        <div class="flex flex-col gap-2">
            <label hlmLabel>Task Branch</label>
            <hlm-select
                [options]="taskBranchOptions"
                [selectedValues]="taskBranch"
                placeholder="Select Branch"
                (selectionChange)="taskBranch = $event"
                [closeOnSelect]="true">
            </hlm-select>
        </div>

        <div class="flex flex-col gap-2">
            <label hlmLabel>Corresponding Branch</label>
            <hlm-select
                [options]="correspondingBranchOptions"
                [selectedValues]="correspondingBranch"
                placeholder="Select Branch"
                (selectionChange)="correspondingBranch = $event"
                [closeOnSelect]="true">
            </hlm-select>
        </div>

        <div class="flex flex-col gap-2">
            <label hlmLabel>Branch Search Type</label>
            <hlm-select
                [options]="branchSearchTypeOptions"
                [selectedValues]="branchSearchType"
                placeholder="Select Type"
                (selectionChange)="branchSearchType = $event"
                [closeOnSelect]="true">
            </hlm-select>
        </div>
    </div>

    <div slot="footer">
        <div class="flex items-center justify-end gap-3 border-t border-border px-5 py-4">
            <button
                hlmBtn
                variant="secondary"
                type="button"
                (click)="onReset(); onApply()">
                Reset
            </button>
            <button
                hlmBtn
                type="button"
                (click)="onApply()">
                Apply Filters
            </button>
        </div>
    </div>
</hlm-dialog>
