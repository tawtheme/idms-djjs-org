<div class="master-tables-container">
    <div class="master-tables-layout">
        <!-- Left Sidebar with Tabs -->
        <div class="master-tables-sidebar">
            <nav class="sidebar-tabs">
                <button *ngFor="let config of masterConfigs" class="tab-item"
                    [class.active]="selectedMasterType === config.type" (click)="onTabSelect(config.type)">
                    {{ config.label }}
                </button>
            </nav>
        </div>

        <!-- Right Content Area -->
        <div class="master-tables-content">
            <!-- Filter Section -->
            <div class="master-listing-search flex flex-row justify-between gap-6 items-center mb-6">
                <input hlmInput type="search" class="w-[300px]" placeholder="Search by Name or Details"
                    [(ngModel)]="searchTerm" [ngModelOptions]="{ standalone: true }" (input)="onSearchInput()" />
                <button hlmBtn size="sm" type="button" (click)="openAddModal()">
                    Add New
                </button>
            </div>

            <div *ngIf="error" class="alert alert--error">
                {{ error }}
            </div>

            <!-- Records table + pagination -->
            <div class="flex flex-1 flex-col overflow-hidden min-h-0">
            <div class="overflow-y-auto max-h-full rounded-lg border border-border">
                <table class="w-full border-collapse text-sm">
                    <thead class="bg-muted border-b border-border">
                        <tr>
                            <th (click)="sortBy('name')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                                Name
                                <app-icon [name]="getSortIcon('name')" class="sort-icon" [size]="14" />
                            </th>
                            <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground whitespace-nowrap">Status</th>
                            <th (click)="sortBy('createdAt')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                                Created At
                                <app-icon [name]="getSortIcon('createdAt')" class="sort-icon" [size]="14" />
                            </th>
                            <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-xs font-semibold text-muted-foreground text-right whitespace-nowrap">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <ng-container *ngIf="!isLoading">
                            <tr *ngFor="let rec of records" (click)="$event.stopPropagation()" class="border-t border-border bg-card transition-colors hover:bg-muted/50 first:border-t-0 relative">
                                <td data-label="Name" class="px-3 py-3 text-sm font-medium text-foreground align-top">
                                    {{ rec.name }}
                                </td>
                                <td data-label="Status" class="status px-3 py-3 text-sm font-medium text-foreground align-top">
                                    <span *ngIf="rec.status" class="status-badge"
                                        [ngClass]="'status-' + (rec.status | lowercase)">
                                        {{ rec.status }}
                                    </span>
                                    <span *ngIf="!rec.status">-</span>
                                </td>
                                <td data-label="Created At" class="px-3 py-3 text-sm font-medium text-foreground align-top">
                                    {{ rec.createdAt ? (rec.createdAt | date:'dd/MM/yyyy h:mm a') : '-' }}
                                </td>
                                <td data-label="Action" class="px-3 py-3 text-sm font-medium text-foreground align-top text-right" (click)="$event.stopPropagation()">
                                    <hlm-menu [options]="getActionOptions(rec)"
                                        (selectionChange)="onAction(rec, $event)">
                                    </hlm-menu>
                                </td>
                            </tr>
                            <!-- Empty state cell -->
                            <tr *ngIf="records.length === 0 && !error" class="border-t border-border bg-card transition-colors hover:bg-muted/50 first:border-t-0 relative">
                                <td [attr.colspan]="4" class="px-5 py-10 text-center">
                                    <hlm-empty-state [title]="searchTerm ? 'No Results Found' : 'No Records Found'"
                                        [description]="searchTerm ? 'No records match your search criteria.' : 'There are no records available for the selected master table.'"
                                        [size]="'small'">
                                    </hlm-empty-state>
                                </td>
                            </tr>
                        </ng-container>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <hlm-pagination [total]="totalItems" [pageSize]="pageSize" [currentPage]="currentPage"
                [pageSizeOptions]="pageSizeOptions" (pageChange)="onPageChange($event)"
                (pageSizeChange)="onPageSizeChange($event)">
            </hlm-pagination>
            </div>
        </div>
    </div>

    <!-- Add / Edit Entry Modal - Only render when needed -->
    <app-add-master-entry-modal *ngIf="isAddModalOpen" [isOpen]="isAddModalOpen" [masterType]="selectedMasterType"
        [masterLabel]="selectedMasterConfig.label" [mode]="isEditMode ? 'edit' : 'add'"
        [initialData]="editingInitialData" (close)="closeAddModal()" (submit)="onAddEntrySubmit($event)">
    </app-add-master-entry-modal>

    <!-- Delete Confirmation Dialog - Always render, controlled by isOpen -->
    <hlm-alert-dialog [isOpen]="isDeleteDialogOpen" title="Delete Record" [message]="deleteConfirmationMessage"
        confirmLabel="Delete" cancelLabel="Cancel" [confirmType]="'danger'" [cancelType]="'secondary'" [closable]="true"
        (confirm)="onConfirmDelete()" (cancel)="onCancelDelete()">
    </hlm-alert-dialog>
</div>
