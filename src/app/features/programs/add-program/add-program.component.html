<div class="mx-auto max-w-[900px] px-6 py-8">
    <div class="mb-8">
        <h2 class="m-0 mb-1 text-2xl font-bold text-foreground">{{ editProgramId ? 'Edit Program' : (duplicateFromId ? 'Duplicate Program' : 'Add New Program') }}</h2>
        <p class="m-0 text-sm text-muted-foreground">{{ editProgramId ? 'Update the program details below' : 'Fill in the details below to create a new program' }}</p>
    </div>

    <form class="flex flex-col gap-6" (ngSubmit)="onSubmit()">
        <!-- Program Details -->
        <div class="rounded-xl border border-border bg-card p-6">
            <div class="mb-5 border-b border-border/60 pb-3">
                <h3 class="m-0 text-base font-semibold text-foreground">Program Details</h3>
            </div>
            <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
                <div class="flex flex-col gap-1.5 md:col-span-2">
                    <label hlmLabel for="program-name">Program Name <span class="text-destructive">*</span></label>
                    <input hlmInput id="program-name" type="text" [(ngModel)]="name" [ngModelOptions]="{ standalone: true }" placeholder="Enter program name" required autofocus>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="program-coordinator">Program Co-ordinator <span class="text-destructive">*</span></label>
                    <hlm-select [options]="programCoordinatorOptions" [selectedValues]="programCoordinator ? [programCoordinator] : []" [autocomplete]="true" [closeOnSelect]="true" placeholder="Select Program Co-ordinator" (selectionChange)="onProgramCoordinatorChange($event)"></hlm-select>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="initiative">Initiative <span class="text-destructive">*</span></label>
                    <hlm-select [options]="initiativeOptions" [selectedValues]="initiative ? [initiative] : []" [autocomplete]="true" [closeOnSelect]="true" placeholder="Select Initiative" (selectionChange)="onInitiativeChange($event)"></hlm-select>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="project">Project <span class="text-destructive">*</span></label>
                    <hlm-select [options]="projectOptions" [selectedValues]="project ? [project] : []" [autocomplete]="true" [closeOnSelect]="true" placeholder="Select Project" (selectionChange)="onProjectChange($event)"></hlm-select>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="branch">Branch <span class="text-destructive">*</span></label>
                    <hlm-select [options]="branchOptions" [selectedValues]="branch ? [branch] : []" [autocomplete]="true" [closeOnSelect]="true" placeholder="Select Branch" (selectionChange)="onBranchChange($event)"></hlm-select>
                </div>
            </div>
        </div>

        <!-- Schedule -->
        <div class="rounded-xl border border-border bg-card p-6">
            <div class="mb-5 border-b border-border/60 pb-3">
                <h3 class="m-0 text-base font-semibold text-foreground">Schedule</h3>
            </div>
            <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="start-date-time">Start Date <span class="text-destructive">*</span></label>
                    <hlm-datepicker
                        [value]="startDateTime"
                        [minDate]="today"
                        placeholder="Select Date"
                        format="dd/MM/yyyy"
                        (dateChange)="onStartDateTimeChange($event)">
                    </hlm-datepicker>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="end-date-time">End Date <span class="text-destructive">*</span></label>
                    <hlm-datepicker
                        [value]="endDateTime"
                        [minDate]="endDateMin"
                        placeholder="Select Date"
                        format="dd/MM/yyyy"
                        (dateChange)="onEndDateTimeChange($event)">
                    </hlm-datepicker>
                </div>
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="repeats">Repeats</label>
                    <hlm-select [options]="repeatsOptions" [selectedValues]="[repeats]" [autocomplete]="true" [closeOnSelect]="true" placeholder="Select Repeats" (selectionChange)="onRepeatsChange($event)"></hlm-select>
                </div>
                <div class="flex flex-col gap-1.5" *ngIf="isRecurring">
                    <label hlmLabel for="repeat-end-date">Repeat End Date <span class="text-destructive">*</span></label>
                    <hlm-datepicker
                        [value]="repeatEndDate"
                        [minDate]="repeatEndDateMin"
                        [initialViewDate]="endDateTime"
                        placeholder="Select Date"
                        format="dd/MM/yyyy"
                        (dateChange)="onRepeatEndDateChange($event)">
                    </hlm-datepicker>
                </div>
            </div>
        </div>

        <!-- Sewa -->
        <div class="rounded-xl border border-border bg-card p-6">
            <div class="mb-5 border-b border-border/60 pb-3">
                <h3 class="m-0 text-base font-semibold text-foreground">Sewa</h3>
            </div>
            <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
                <div class="flex flex-col gap-1.5 md:col-span-2">
                    <label hlmLabel for="choose-sewa">Choose Sewa <span class="text-destructive">*</span></label>
                    <hlm-select [options]="sewaOptions" [selectedValues]="chooseSewa" [searchable]="true" [multiSelect]="true" [showSelectAll]="true" [closeOnSelect]="false" placeholder="Select Sewa" (selectionChange)="onChooseSewaChange($event)"></hlm-select>
                </div>
            </div>
        </div>

        <!-- Additional Information -->
        <div class="rounded-xl border border-border bg-card p-6">
            <div class="mb-5 border-b border-border/60 pb-3">
                <h3 class="m-0 text-base font-semibold text-foreground">Additional Information</h3>
            </div>
            <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
                <div class="flex flex-col gap-1.5">
                    <label hlmLabel for="status">Status</label>
                    <hlm-select [options]="statusOptions" [selectedValues]="[status]" [autocomplete]="true" [closeOnSelect]="true" placeholder="Select Status" (selectionChange)="onStatusChange($event)"></hlm-select>
                </div>
                <div class="flex flex-col gap-1.5 md:col-span-2">
                    <label hlmLabel for="remarks">Remarks</label>
                    <textarea hlmInput id="remarks" class="resize-y" [(ngModel)]="remarks" [ngModelOptions]="{ standalone: true }" placeholder="Enter remarks" rows="4"></textarea>
                </div>
            </div>
        </div>

        <!-- Form Actions -->
        <div class="flex items-center justify-end gap-3 pt-2">
            <button hlmBtn variant="secondary" type="button" (click)="onCancel()">Cancel</button>
            <button hlmBtn type="submit" [disabled]="!isFormValid || isSubmitting">
                {{ isSubmitting ? 'Submitting...' : (editProgramId ? 'Update Program' : 'Create Program') }}
            </button>
        </div>
    </form>
</div>
