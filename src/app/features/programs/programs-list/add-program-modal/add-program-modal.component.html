<hlm-dialog [isOpen]="isOpen" [title]="'Add New Program'" [size]="'medium'" [closable]="true" [showHeader]="true"
    [showFooter]="true" [footerButtons]="footerButtons" [footerAlign]="'right'" (close)="onClose()"
    (footerAction)="onFooterAction($event)">

    <form class="flex flex-col gap-5" (ngSubmit)="onSubmit()">
        <!-- Row 1: Program Name, Program Co-ordinator, Initiative -->
        <div class="grid grid-cols-1 gap-5 md:grid-cols-3">
            <div class="flex flex-col gap-1.5">
                <label hlmLabel for="program-name">
                    Program Name <span class="text-destructive">*</span>
                </label>
                <input hlmInput id="program-name" type="text" [(ngModel)]="name"
                    [ngModelOptions]="{ standalone: true }" placeholder="Enter program name" required autofocus>
            </div>

            <div class="flex flex-col gap-1.5">
                <label hlmLabel for="program-coordinator">
                    Program Co-ordinator <span class="text-destructive">*</span>
                </label>
                <hlm-select [options]="programCoordinatorOptions"
                    [selectedValues]="programCoordinator ? [programCoordinator] : []" [searchable]="true"
                    [closeOnSelect]="true" placeholder="Select Program Co-ordinator"
                    (selectionChange)="onProgramCoordinatorChange($event)">
                </hlm-select>
            </div>

            <div class="flex flex-col gap-1.5">
                <label hlmLabel for="initiative">
                    Initiative <span class="text-destructive">*</span>
                </label>
                <hlm-select [options]="initiativeOptions" [selectedValues]="initiative ? [initiative] : []"
                    [searchable]="true" [closeOnSelect]="true" placeholder="Select Initiative"
                    (selectionChange)="onInitiativeChange($event)">
                </hlm-select>
            </div>
        </div>

        <!-- Row 2: Project, Branch, Choose Sewa -->
        <div class="grid grid-cols-1 gap-5 md:grid-cols-3">
            <div class="flex flex-col gap-1.5">
                <label hlmLabel for="project">
                    Project <span class="text-destructive">*</span>
                </label>
                <hlm-select [options]="projectOptions" [selectedValues]="project ? [project] : []" [searchable]="true"
                    [closeOnSelect]="true" placeholder="Select Project" (selectionChange)="onProjectChange($event)">
                </hlm-select>
            </div>

            <div class="flex flex-col gap-1.5">
                <label hlmLabel for="branch">
                    Branch <span class="text-destructive">*</span>
                </label>
                <hlm-select [options]="branchOptions" [selectedValues]="branch ? [branch] : []" [searchable]="true"
                    [closeOnSelect]="true" placeholder="Select Branch" (selectionChange)="onBranchChange($event)">
                </hlm-select>
            </div>

            <div class="flex flex-col gap-1.5">
                <label hlmLabel for="choose-sewa">
                    Choose Sewa <span class="text-destructive">*</span>
                </label>
                <input hlmInput id="choose-sewa" type="text" [(ngModel)]="chooseSewa"
                    [ngModelOptions]="{ standalone: true }" placeholder="Enter sewa" required>
            </div>
        </div>

        <!-- Row 3: Start Date Time, End Date Time, Status -->
        <div class="grid grid-cols-1 gap-5 md:grid-cols-3">
            <div class="flex flex-col gap-1.5">
                <label hlmLabel for="start-date-time">
                    Start Date Time <span class="text-destructive">*</span>
                </label>
                <hlm-datepicker [value]="startDateTime" placeholder="DD/MM/YYYY" format="dd/MM/yyyy"
                    (dateChange)="onStartDateTimeChange($event)">
                </hlm-datepicker>
            </div>

            <div class="flex flex-col gap-1.5">
                <label hlmLabel for="end-date-time">
                    End Date Time <span class="text-destructive">*</span>
                </label>
                <hlm-datepicker [value]="endDateTime" placeholder="DD/MM/YYYY" format="dd/MM/yyyy"
                    (dateChange)="onEndDateTimeChange($event)">
                </hlm-datepicker>
            </div>

            <div class="flex flex-col gap-1.5">
                <label hlmLabel for="status">
                    Status
                </label>
                <hlm-select [options]="statusOptions" [selectedValues]="[status]" [searchable]="true"
                    [closeOnSelect]="true" placeholder="Select Status" (selectionChange)="onStatusChange($event)">
                </hlm-select>
            </div>
        </div>

        <!-- Row 4: Repeats, Remarks -->
        <div class="grid grid-cols-1 gap-5 md:grid-cols-3">
            <div class="flex flex-col gap-1.5">
                <label hlmLabel for="repeats">
                    Repeats
                </label>
                <hlm-select [options]="repeatsOptions" [selectedValues]="[repeats]" [searchable]="true"
                    [closeOnSelect]="true" placeholder="Select Repeats" (selectionChange)="onRepeatsChange($event)">
                </hlm-select>
            </div>

            <div class="flex flex-col gap-1.5 md:col-span-2">
                <label hlmLabel for="remarks">
                    Remarks
                </label>
                <textarea hlmInput id="remarks" class="resize-y" [(ngModel)]="remarks"
                    [ngModelOptions]="{ standalone: true }" placeholder="Enter remarks" rows="4"></textarea>
            </div>
        </div>
    </form>
</hlm-dialog>
