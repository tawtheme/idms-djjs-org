<div class="reports-container">
    <!-- Search & Filter Panel -->
    <div class="search-panel">
        <div class="filters-grid filters-grid--four">
            <div class="filter-field">
                <label>Task Branch</label>
                <hlm-select
                    [options]="branchOptions"
                    [selectedValues]="selectedTaskBranch"
                    placeholder="None"
                    [searchable]="true"
                    [autocomplete]="true"
                    (selectionChange)="onTaskBranchChange($event)"
                    [closeOnSelect]="true">
                </hlm-select>
            </div>
            <div class="filter-field">
                <label>Programs</label>
                <hlm-select
                    [options]="programOptions"
                    [selectedValues]="selectedPrograms"
                    placeholder=""
                    [searchable]="true"
                    [autocomplete]="true"
                    (selectionChange)="selectedPrograms = $event"
                    [closeOnSelect]="true">
                </hlm-select>
            </div>
            <div class="filter-field filter-field--actions">
                <label>&nbsp;</label>
                <div class="filter-actions">
                    <button hlmBtn type="button" (click)="applyFilter()">Search</button>
                    <button hlmBtn variant="outline" type="button" [disabled]="isExporting" (click)="exportReport('web')">{{ isExporting ? 'Exporting...' : 'Export' }}</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Error state -->
    <div *ngIf="error" class="error-state">
        <p>{{ error }}</p>
        <button hlmBtn size="sm" (click)="loadReport()">Retry</button>
    </div>

    <ng-container *ngIf="!error">
        <div class="flex flex-1 flex-col overflow-hidden min-h-0">
            <div class="overflow-y-auto max-h-full rounded-lg border border-border">
                <table class="w-full border-collapse text-sm">
                    <thead class="bg-muted border-b border-border">
                        <tr>
                            <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('sewaName')">
                                <span class="th-content inline-flex items-center gap-1">
                                    Sewa Name
                                    <app-icon
                                        [name]="sortField === 'sewaName' && sortDirection === 'asc' ? 'arrow_upward' : sortField === 'sewaName' && sortDirection === 'desc' ? 'arrow_downward' : 'unfold_more'"
                                        class="sort-icon"
                                        [class.sort-icon--active]="sortField === 'sewaName'" [size]="14" />
                                </span>
                            </th>
                            <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('present')">
                                <span class="th-content inline-flex items-center gap-1">
                                    Present
                                    <app-icon
                                        [name]="sortField === 'present' && sortDirection === 'asc' ? 'arrow_upward' : sortField === 'present' && sortDirection === 'desc' ? 'arrow_downward' : 'unfold_more'"
                                        class="sort-icon"
                                        [class.sort-icon--active]="sortField === 'present'" [size]="14" />
                                </span>
                            </th>
                            <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('absent')">
                                <span class="th-content inline-flex items-center gap-1">
                                    Absent
                                    <app-icon
                                        [name]="sortField === 'absent' && sortDirection === 'asc' ? 'arrow_upward' : sortField === 'absent' && sortDirection === 'desc' ? 'arrow_downward' : 'unfold_more'"
                                        class="sort-icon"
                                        [class.sort-icon--active]="sortField === 'absent'" [size]="14" />
                                </span>
                            </th>
                            <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('onLeave')">
                                <span class="th-content inline-flex items-center gap-1">
                                    On Leave
                                    <app-icon
                                        [name]="sortField === 'onLeave' && sortDirection === 'asc' ? 'arrow_upward' : sortField === 'onLeave' && sortDirection === 'desc' ? 'arrow_downward' : 'unfold_more'"
                                        class="sort-icon"
                                        [class.sort-icon--active]="sortField === 'onLeave'" [size]="14" />
                                </span>
                            </th>
                            <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('total')">
                                <span class="th-content inline-flex items-center gap-1">
                                    Total
                                    <app-icon
                                        [name]="sortField === 'total' && sortDirection === 'asc' ? 'arrow_upward' : sortField === 'total' && sortDirection === 'desc' ? 'arrow_downward' : 'unfold_more'"
                                        class="sort-icon"
                                        [class.sort-icon--active]="sortField === 'total'" [size]="14" />
                                </span>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr *ngFor="let row of rows; trackBy: trackById" class="border-t border-border bg-card transition-colors hover:bg-muted/50 first:border-t-0 relative">
                            <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Sewa Name">{{ row.sewaName }}</td>
                            <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Present">{{ row.present }}</td>
                            <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Absent">{{ row.absent }}</td>
                            <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="On Leave">{{ row.onLeave }}</td>
                            <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Total">{{ row.total }}</td>
                        </tr>
                        <tr *ngIf="rows.length === 0" class="empty-row">
                            <td class="px-5 py-10 text-center" colspan="5">
                                <hlm-empty-state
                                    title="No data available in table"
                                    description="There are no volunteer counts matching the selected filters."
                                    [size]="'small'">
                                </hlm-empty-state>
                            </td>
                        </tr>
                    </tbody>
                    <tfoot *ngIf="rows.length > 0">
                        <tr class="totals-row">
                            <td class="px-3 py-3 text-sm font-medium text-foreground align-top totals-label">Total Volunteers:</td>
                            <td class="px-3 py-3 text-sm font-medium text-foreground align-top">{{ totals.present }}</td>
                            <td class="px-3 py-3 text-sm font-medium text-foreground align-top">{{ totals.absent }}</td>
                            <td class="px-3 py-3 text-sm font-medium text-foreground align-top">{{ totals.onLeave }}</td>
                            <td class="px-3 py-3 text-sm font-medium text-foreground align-top">{{ totals.total }}</td>
                        </tr>
                    </tfoot>
                </table>
            </div>

            <hlm-pagination
                [total]="totalItems"
                [pageSize]="pageSize"
                [currentPage]="currentPage"
                [pageSizeOptions]="pageSizeOptions"
                (pageChange)="onPageChange($event)"
                (pageSizeChange)="onPageSizeChange($event)">
            </hlm-pagination>
        </div>
    </ng-container>
</div>
