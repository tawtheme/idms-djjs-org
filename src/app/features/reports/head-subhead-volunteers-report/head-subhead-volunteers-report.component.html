<div class="reports-container">
    <!-- Search & Filter Panel -->
    <div class="search-panel">
        <div class="filters-grid filters-grid--four">
            <div class="filter-field">
                <label>Task Branch</label>
                <hlm-select
                    [options]="taskBranchOptions"
                    [selectedValues]="selectedTaskBranch"
                    placeholder="None"
                    [searchable]="true"
                    [autocomplete]="true"
                    (selectionChange)="selectedTaskBranch = $event"
                    [closeOnSelect]="true">
                </hlm-select>
            </div>
            <div class="filter-field filter-field--actions">
                <label>&nbsp;</label>
                <div class="filter-actions">
                    <button hlmBtn type="button" [disabled]="isLoading || isExporting" (click)="applyFilter()">Search</button>
                    <button hlmBtn variant="outline" type="button" [disabled]="isLoading || isExporting" (click)="exportReport('web')">Export</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading -->
    <ng-container *ngIf="!isLoading && !isExporting">
        <!-- Error state -->
        <div *ngIf="error" class="error-state">
            <p>{{ error }}</p>
            <button hlmBtn size="sm" (click)="loadReport()">Retry</button>
        </div>

        <ng-container *ngIf="!error">
            <div class="flex flex-1 flex-col overflow-hidden min-h-0">
                <div class="overflow-y-auto max-h-full rounded-lg border border-border">
                    <table class="w-full border-collapse text-sm">
                        <thead class="bg-muted border-b border-border">
                            <tr>
                                <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('sewaName')">
                                    <span class="th-content inline-flex items-center gap-1">
                                        Sewa Name
                                        <app-icon
                                            [name]="getSortIcon('sewaName')"
                                            class="sort-icon"
                                            [class.sort-icon--active]="sortField === 'sewaName'" [size]="14" />
                                    </span>
                                </th>
                                <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('headName')">
                                    <span class="th-content inline-flex items-center gap-1">
                                        Head Name
                                        <app-icon
                                            [name]="getSortIcon('headName')"
                                            class="sort-icon"
                                            [class.sort-icon--active]="sortField === 'headName'" [size]="14" />
                                    </span>
                                </th>
                                <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('headContact')">
                                    <span class="th-content inline-flex items-center gap-1">
                                        Head Contact
                                        <app-icon
                                            [name]="getSortIcon('headContact')"
                                            class="sort-icon"
                                            [class.sort-icon--active]="sortField === 'headContact'" [size]="14" />
                                    </span>
                                </th>
                                <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('headAddress')">
                                    <span class="th-content inline-flex items-center gap-1">
                                        Head Address
                                        <app-icon
                                            [name]="getSortIcon('headAddress')"
                                            class="sort-icon"
                                            [class.sort-icon--active]="sortField === 'headAddress'" [size]="14" />
                                    </span>
                                </th>
                                <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('subHeadName')">
                                    <span class="th-content inline-flex items-center gap-1">
                                        Sub Head Name
                                        <app-icon
                                            [name]="getSortIcon('subHeadName')"
                                            class="sort-icon"
                                            [class.sort-icon--active]="sortField === 'subHeadName'" [size]="14" />
                                    </span>
                                </th>
                                <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('subHeadContact')">
                                    <span class="th-content inline-flex items-center gap-1">
                                        Sub Head Contact
                                        <app-icon
                                            [name]="getSortIcon('subHeadContact')"
                                            class="sort-icon"
                                            [class.sort-icon--active]="sortField === 'subHeadContact'" [size]="14" />
                                    </span>
                                </th>
                                <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('subHeadAddress')">
                                    <span class="th-content inline-flex items-center gap-1">
                                        Sub Head Address
                                        <app-icon
                                            [name]="getSortIcon('subHeadAddress')"
                                            class="sort-icon"
                                            [class.sort-icon--active]="sortField === 'subHeadAddress'" [size]="14" />
                                    </span>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let row of rows; trackBy: trackById" class="border-t border-border bg-card transition-colors hover:bg-muted/50 first:border-t-0 relative">
                                <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Sewa Name">{{ row.sewaName }}</td>
                                <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Head Name">{{ row.headName }}</td>
                                <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Head Contact">{{ row.headContact }}</td>
                                <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Head Address">{{ row.headAddress }}</td>
                                <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Sub Head Name">{{ row.subHeadName }}</td>
                                <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Sub Head Contact">{{ row.subHeadContact }}</td>
                                <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Sub Head Address">{{ row.subHeadAddress }}</td>
                            </tr>
                            <tr *ngIf="rows.length === 0" class="empty-row">
                                <td class="px-5 py-10 text-center" colspan="7">
                                    <hlm-empty-state
                                        title="No data available in table"
                                        description="There are no records matching the selected filters."
                                        [size]="'small'">
                                    </hlm-empty-state>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <hlm-pagination
                    [total]="totalItems"
                    [pageSize]="pageSize"
                    [currentPage]="currentPage"
                    [pageSizeOptions]="pageSizeOptions"
                    (pageChange)="onPageChange($event)"
                    (pageSizeChange)="onPageSizeChange($event)">
                </hlm-pagination>
            </div>
        </ng-container>
    </ng-container>
</div>
