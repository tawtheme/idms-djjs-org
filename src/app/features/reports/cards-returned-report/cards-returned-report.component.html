<div class="reports-container">
    <!-- Search & Filter Panel -->
    <div class="search-panel">
        <div class="filters-grid filters-grid--four">
            <div class="filter-field">
                <label>Task Branch <span class="required">*</span></label>
                <hlm-select
                    [options]="branchOptions"
                    [selectedValues]="selectedTaskBranch"
                    placeholder="Select Task Branch"
                    [searchable]="true"
                    [autocomplete]="true"
                    (selectionChange)="onTaskBranchChange($event)"
                    [closeOnSelect]="true">
                </hlm-select>
                <div *ngIf="branchError" class="field-error">{{ branchError }}</div>
            </div>
            <div class="filter-field">
                <label>Card Status</label>
                <hlm-select
                    [options]="cardStatusOptions"
                    [selectedValues]="selectedCardStatus"
                    placeholder="Select Card Status"
                    (selectionChange)="selectedCardStatus = $event"
                    [closeOnSelect]="true">
                </hlm-select>
            </div>
            <div class="filter-field">
                <label>Programs <span class="required">*</span></label>
                <hlm-select
                    [options]="programOptions"
                    [selectedValues]="selectedPrograms"
                    placeholder="Select Programs"
                    [searchable]="true"
                    [autocomplete]="true"
                    (selectionChange)="selectedPrograms = $event; programError = null"
                    [closeOnSelect]="true">
                </hlm-select>
                <div *ngIf="programError" class="field-error">{{ programError }}</div>
            </div>
            <div class="filter-field">
                <label>Sewas</label>
                <hlm-select
                    [options]="sewaOptions"
                    [selectedValues]="selectedSewas"
                    placeholder="Select Sewas"
                    [searchable]="true"
                    [autocomplete]="true"
                    (selectionChange)="selectedSewas = $event"
                    [closeOnSelect]="true">
                </hlm-select>
            </div>
            <div class="filter-field filter-field--actions">
                <label>&nbsp;</label>
                <div class="filter-actions">
                    <button hlmBtn type="button" (click)="applyFilter()">Search</button>
                    <button hlmBtn variant="outline" type="button" [disabled]="isExporting" (click)="exportReport('web')">Export</button>
                </div>
            </div>
        </div>
    </div>

    <div *ngIf="error && !isLoading" class="error-state">
        <p>{{ error }}</p>
        <button hlmBtn size="sm" (click)="loadReport()">Retry</button>
    </div>

    <ng-container *ngIf="!error">
            <div class="flex flex-1 flex-col overflow-hidden min-h-0">
                <div class="overflow-y-auto max-h-full rounded-lg border border-border">
                    <table class="w-full border-collapse text-sm">
                        <thead class="bg-muted border-b border-border">
                            <tr>
                                <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('id')">
                                    <span class="th-content inline-flex items-center gap-1">
                                        Id
                                        <app-icon [name]="getSortIcon('id')" class="sort-icon" [class.sort-icon--active]="sortField === 'id'" [size]="14" />
                                    </span>
                                </th>
                                <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground whitespace-nowrap">Image</th>
                                <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('name')">
                                    <span class="th-content inline-flex items-center gap-1">
                                        Name
                                        <app-icon [name]="getSortIcon('name')" class="sort-icon" [class.sort-icon--active]="sortField === 'name'" [size]="14" />
                                    </span>
                                </th>
                                <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('phone')">
                                    <span class="th-content inline-flex items-center gap-1">
                                        Phone
                                        <app-icon [name]="getSortIcon('phone')" class="sort-icon" [class.sort-icon--active]="sortField === 'phone'" [size]="14" />
                                    </span>
                                </th>
                                <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('fatherName')">
                                    <span class="th-content inline-flex items-center gap-1">
                                        Father Name
                                        <app-icon [name]="getSortIcon('fatherName')" class="sort-icon" [class.sort-icon--active]="sortField === 'fatherName'" [size]="14" />
                                    </span>
                                </th>
                                <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('sewa')">
                                    <span class="th-content inline-flex items-center gap-1">
                                        Sewa
                                        <app-icon [name]="getSortIcon('sewa')" class="sort-icon" [class.sort-icon--active]="sortField === 'sewa'" [size]="14" />
                                    </span>
                                </th>
                                <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('badgeNo')">
                                    <span class="th-content inline-flex items-center gap-1">
                                        Badge No
                                        <app-icon [name]="getSortIcon('badgeNo')" class="sort-icon" [class.sort-icon--active]="sortField === 'badgeNo'" [size]="14" />
                                    </span>
                                </th>
                                <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('checkIn')">
                                    <span class="th-content inline-flex items-center gap-1">
                                        Check In
                                        <app-icon [name]="getSortIcon('checkIn')" class="sort-icon" [class.sort-icon--active]="sortField === 'checkIn'" [size]="14" />
                                    </span>
                                </th>
                                <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground cursor-pointer hover:bg-muted/70 whitespace-nowrap" (click)="sortBy('checkOut')">
                                    <span class="th-content inline-flex items-center gap-1">
                                        Check Out
                                        <app-icon [name]="getSortIcon('checkOut')" class="sort-icon" [class.sort-icon--active]="sortField === 'checkOut'" [size]="14" />
                                    </span>
                                </th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr *ngFor="let row of rows; trackBy: trackById" class="border-t border-border bg-card transition-colors hover:bg-muted/50 first:border-t-0 relative">
                                <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Id">{{ row.id }}</td>
                                <td class="px-3 py-3 text-sm font-medium text-foreground align-top name-with-image" data-label="Image">
                                    <div class="volunteer-image">
                                        <img [src]="row.image || '/assets/img/placeholder.svg'" [alt]="row.name" [appImagePreview]="row.image" [previewTitle]="row.name || 'Volunteer Photo'" />
                                    </div>
                                </td>
                                <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Name">{{ row.name }}</td>
                                <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Phone">{{ row.phone }}</td>
                                <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Father Name">{{ row.fatherName }}</td>
                                <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Sewa">{{ row.sewa }}</td>
                                <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Badge No">{{ row.badgeNo }}</td>
                                <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Check In">{{ row.checkIn }}</td>
                                <td class="px-3 py-3 text-sm font-medium text-foreground align-top" data-label="Check Out">{{ row.checkOut }}</td>
                            </tr>
                            <tr *ngIf="rows.length === 0" class="empty-row">
                                <td class="px-5 py-10 text-center" colspan="9">
                                    <hlm-empty-state
                                        title="No Records"
                                        description="There are no cards matching the selected filters."
                                        [size]="'small'">
                                    </hlm-empty-state>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <hlm-pagination
                    [total]="totalItems"
                    [pageSize]="pageSize"
                    [currentPage]="currentPage"
                    [pageSizeOptions]="pageSizeOptions"
                    (pageChange)="onPageChange($event)"
                    (pageSizeChange)="onPageSizeChange($event)">
                </hlm-pagination>
            </div>
    </ng-container>
</div>
