<div class="flex min-h-screen items-center justify-center bg-muted/40 px-4 py-12">
  <div class="w-full max-w-md rounded-xl border border-border bg-card p-8 shadow-sm">
    <div class="mb-6 text-center">
      <h1 class="m-0 mb-1.5 text-2xl font-bold text-foreground">Forgot Password</h1>
      <p class="m-0 text-sm text-muted-foreground">Enter your email to receive reset instructions</p>
    </div>

    <div *ngIf="!isSubmitted; else submittedTemplate">
      <form (ngSubmit)="onSubmit()" #forgotForm="ngForm" class="flex flex-col gap-5">
        <div class="flex flex-col gap-1.5">
          <label hlmLabel for="email">Email Address</label>
          <input
            hlmInput
            type="email"
            id="email"
            name="email"
            [(ngModel)]="email"
            required
            email
            #emailField="ngModel"
            placeholder="Enter your email address"
            [class.border-destructive]="emailField.invalid && emailField.touched" />
          <div *ngIf="emailField.invalid && emailField.touched" class="text-xs text-destructive">
            <span *ngIf="emailField.errors?.['required']">Email is required</span>
            <span *ngIf="emailField.errors?.['email']">Please enter a valid email</span>
          </div>
        </div>

        <button hlmBtn type="submit" class="w-full" [disabled]="forgotForm.invalid">
          Send Reset Instructions
        </button>

        <div class="text-center text-sm">
          <a routerLink="/login" class="font-medium text-primary hover:underline">Back to Sign In</a>
        </div>
      </form>
    </div>

    <ng-template #submittedTemplate>
      <div class="flex flex-col items-center gap-4 text-center">
        <div class="flex h-14 w-14 items-center justify-center rounded-full bg-emerald-100 text-2xl text-emerald-600">✓</div>
        <h3 class="m-0 text-lg font-semibold text-foreground">Check Your Email</h3>
        <p class="m-0 text-sm text-muted-foreground">We've sent password reset instructions to <strong class="text-foreground">{{ email }}</strong></p>
        <p class="m-0 text-xs text-muted-foreground">Didn't receive the email? Check your spam folder or try again.</p>

        <div class="mt-2 flex w-full flex-col gap-2 sm:flex-row sm:justify-center">
          <button hlmBtn variant="secondary" type="button" (click)="isSubmitted = false">
            Try Different Email
          </button>
          <a hlmBtn routerLink="/login">Back to Sign In</a>
        </div>
      </div>
    </ng-template>
  </div>
</div>
