<hlm-dialog [isOpen]="isOpen" [title]="'Add New Project'" [size]="'small'" [closable]="true" [showHeader]="true"
    [showFooter]="true" [footerButtons]="footerButtons" [footerAlign]="'right'" (close)="onClose()"
    (footerAction)="onFooterAction($event)">

    <form class="flex flex-col gap-5" (ngSubmit)="onSubmit()">
        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="project-name">
                Project Name <span class="text-destructive">*</span>
            </label>
            <input hlmInput id="project-name" type="text" [(ngModel)]="name"
                [ngModelOptions]="{ standalone: true }" placeholder="Enter project name" required autofocus>
        </div>

        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="project-head">
                Project Head <span class="text-destructive">*</span>
            </label>
            <hlm-select [options]="projectHeadOptions" [selectedValues]="selectedProjectHead"
                [searchable]="true" [closeOnSelect]="true" placeholder="Select Project Head"
                (selectionChange)="onProjectHeadChange($event)">
            </hlm-select>
        </div>

        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="initiative">
                Initiative <span class="text-destructive">*</span>
            </label>
            <hlm-select [options]="initiativeOptions" [selectedValues]="selectedInitiative"
                [searchable]="true" [closeOnSelect]="true" placeholder="Select Initiative"
                (selectionChange)="onInitiativeChange($event)">
            </hlm-select>
        </div>

        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="description">
                Description <span class="text-destructive">*</span>
            </label>
            <textarea hlmInput id="description" [(ngModel)]="description"
                [ngModelOptions]="{ standalone: true }" placeholder="Enter project description" rows="4"
                required></textarea>
        </div>

        <div class="flex flex-col gap-1.5">
            <label hlmLabel for="status">
                Status
            </label>
            <hlm-select [options]="statusOptions" [selectedValues]="[status]"
                [closeOnSelect]="true" placeholder="Select Status" (selectionChange)="onStatusChange($event)">
            </hlm-select>
        </div>
    </form>
</hlm-dialog>
