<div class="mx-auto max-w-7xl px-4 py-6">
    <ng-container *ngIf="!isLoading">
    <!-- Donation Amounts Section -->
    <div class="mb-8 grid grid-cols-1 gap-6 md:grid-cols-2">
        <div class="rounded-xl border border-border bg-card p-6">
            <div class="mb-3 text-sm font-medium text-muted-foreground">Total Donation Amount</div>
            <div class="text-3xl font-bold leading-tight text-foreground">{{ totalDonation || '—' }}</div>
        </div>
        <div class="rounded-xl border border-border bg-card p-6">
            <div class="mb-3 text-sm font-medium text-muted-foreground">Latest Month Donation Amount</div>
            <div class="text-3xl font-bold leading-tight text-foreground">{{ latestMonthDonation || '—' }}</div>
        </div>
    </div>

    <!-- Main Content Area -->
    <div class="grid grid-cols-1 gap-6 lg:grid-cols-[2fr_1fr]">
        <!-- Stats Grid -->
        <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
            <div class="flex items-center gap-4 rounded-xl border border-border bg-card p-5 transition-all hover:-translate-y-0.5 hover:shadow-md" *ngFor="let stat of stats">
                <div class="flex h-14 w-14 flex-shrink-0 items-center justify-center rounded-xl"
                    [ngClass]="stat.iconColor === 'blue' ? 'bg-primary/10 text-primary' : 'bg-emerald-500/10 text-emerald-600'">
                    <app-icon [name]="stat.icon" />
                </div>
                <div class="min-w-0 flex-1">
                    <div class="mb-2 text-[13px] font-medium leading-snug text-muted-foreground">{{ stat.title }}</div>
                    <div class="text-2xl font-bold leading-tight text-foreground">{{ formatNumber(stat.value) }}</div>
                </div>
            </div>
        </div>

        <!-- Upcoming Programs Section -->
        <div class="flex h-fit flex-col rounded-xl border border-border bg-card p-6">
            <div class="mb-5 flex items-center justify-between">
                <h2 class="m-0 text-lg font-semibold text-foreground">Upcoming Programs</h2>
                <a class="inline-block rounded-md bg-muted px-3 py-1.5 text-[13px] font-medium text-muted-foreground no-underline transition-colors hover:bg-accent hover:text-foreground" routerLink="/programs">View All</a>
            </div>
            <div class="flex-1">
                <div class="flex min-h-[200px] items-center justify-center text-sm text-muted-foreground" *ngIf="!upcomingPrograms.length">
                    <p>No upcoming programs</p>
                </div>
            </div>
        </div>
    </div>
    </ng-container>
</div>
