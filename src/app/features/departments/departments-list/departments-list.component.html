<div class="flex h-full flex-col gap-4 overflow-hidden">
    <div class="flex items-center justify-between">
    </div>

    <!-- Filter Section -->
    <div class="flex flex-row justify-between gap-6">
        <input
            hlmInput
            type="search"
            placeholder="Search by Name, Email, Branch or User"
            [(ngModel)]="searchTerm"
            [ngModelOptions]="{ standalone: true }"
            (input)="applyFilters()"
        />
        <button hlmBtn size="sm" type="button">
            Add New
        </button>
    </div>

    <!-- Departments table -->
     <div class="flex flex-1 flex-col overflow-hidden min-h-0">
        <div class="overflow-y-auto max-h-full rounded-lg border border-border">
            <table class="w-full border-collapse text-sm">
                <thead class="bg-muted border-b border-border">
                    <tr>
                        <th class="checkbox-column sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                            <input
                                type="checkbox"
                                [checked]="isAllSelected()"
                                [indeterminate]="isIndeterminate()"
                                (change)="toggleSelectAll($event)"
                                (click)="$event.stopPropagation()">
                        </th>
                        <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground whitespace-nowrap">Action</th>
                        <th (click)="sortBy('name')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                            Name
                            <app-icon [name]="getSortIcon('name')" class="sort-icon" [size]="14" />
                        </th>
                        <th (click)="sortBy('email')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                            Email
                            <app-icon [name]="getSortIcon('email')" class="sort-icon" [size]="14" />
                        </th>
                        <th (click)="sortBy('branchName')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                            Branch Name
                            <app-icon [name]="getSortIcon('branchName')" class="sort-icon" [size]="14" />
                        </th>
                        <th (click)="sortBy('userName')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                            User Name
                            <app-icon [name]="getSortIcon('userName')" class="sort-icon" [size]="14" />
                        </th>
                        <th class="sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground whitespace-nowrap">Status</th>
                        <th (click)="sortBy('createdAt')" class="sortable sticky top-0 z-10 bg-muted px-3 py-2 text-left text-xs font-semibold text-muted-foreground">
                            Created At
                            <app-icon [name]="getSortIcon('createdAt')" class="sort-icon" [size]="14" />
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let dept of pagedDepartments; trackBy: trackById" (click)="$event.stopPropagation()" class="border-t border-border bg-card transition-colors hover:bg-muted/50 first:border-t-0 relative">
                        <td class="checkbox-column px-3 py-3 text-sm font-medium text-foreground align-top" (click)="$event.stopPropagation()">
                            <input
                                type="checkbox"
                                [checked]="selectedDepartments.has(dept.id)"
                                (change)="toggleSelectDepartment(dept.id, $event)">
                        </td>
                        <td data-label="Action" class="px-3 py-3 text-sm font-medium text-foreground align-top" (click)="$event.stopPropagation()">
                            <hlm-menu
                                [options]="getActionOptions(dept)"
                                (selectionChange)="onAction(dept, $event)">
                            </hlm-menu>
                        </td>
                        <td data-label="Name" class="px-3 py-3 text-sm font-medium text-foreground align-top">
                            {{ dept.name }}
                        </td>
                        <td data-label="Email" class="px-3 py-3 text-sm font-medium text-foreground align-top">
                            {{ dept.email || '-' }}
                        </td>
                        <td data-label="Branch Name" class="px-3 py-3 text-sm font-medium text-foreground align-top">
                            {{ dept.branchName || '-' }}
                        </td>
                        <td data-label="User Name" class="px-3 py-3 text-sm font-medium text-foreground align-top">
                            {{ dept.userName || '-' }}
                        </td>
                        <td data-label="Status" class="status px-3 py-3 text-sm font-medium text-foreground align-top">
                            <span class="status-badge" [ngClass]="'status-' + (dept.status | lowercase)">
                                {{ dept.status }}
                            </span>
                        </td>
                        <td data-label="Created At" class="px-3 py-3 text-sm font-medium text-foreground align-top">
                            {{ dept.createdAt }}
                        </td>
                    </tr>
                    <tr *ngIf="pagedDepartments.length === 0" class="border-t border-border bg-card transition-colors hover:bg-muted/50 first:border-t-0 relative">
                        <td [attr.colspan]="8" class="no-data px-5 py-10 text-center">No data available in table</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <hlm-pagination
            [total]="totalItems"
            [pageSize]="pageSize"
            [currentPage]="currentPage"
            [pageSizeOptions]="pageSizeOptions"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">
        </hlm-pagination>
    </div>

    <!-- Empty state -->
    <hlm-empty-state
        *ngIf="departments.length === 0 && !searchTerm"
        title="No Departments Found"
        message="There are no departments available at the moment.">
    </hlm-empty-state>
</div>
